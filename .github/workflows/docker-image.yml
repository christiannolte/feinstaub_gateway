name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "deploy/**" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "deploy/**" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        docker build . --file Dockerfile --tag christiannolte/airrohrgateway:latest
    - name: Show the Docker image
      run: |
        docker images
    - name: Login on Dockerhub
      run: |
        echo -n ${{ secrets.DOCKER_HUB_TOKEN }} | docker login -u christiannolte --password-stdin 
    - name: Push to Dockerhub
      run: |
        docker push christiannolte/airrohrgateway:latest
    - name: Logout from Dockerhub
      run: |
        docker logout
