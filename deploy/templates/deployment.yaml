apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "Always" 
      restartPolicy: Always
      containers:
        - name: {{ .Release.Name }}
          image: christiannolte/airrohrgateway:latest
          imagePullPolicy: Always
          env:
            - name: url
              value: {{ .Values.url }}
            - name: topic
              value: {{ .Values.topic }}
          # Wartet auf den ersten erfolgreichen Durchlauf (hoechstens 180s)
          startupProbe:
            exec:
              command: ["test", "-f", "/tmp/heartbeat"]
            periodSeconds: 5
            failureThreshold: 36
          # Neustart, wenn laenger als 180s nichts erfolgreich gelesen und gesendet wurde
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/heartbeat') > 180)"
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 2
